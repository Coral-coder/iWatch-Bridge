# Builds, tests and signs the Android companion app.
#
#   every push / PR      unit tests (protocol + app) and a debug APK, uploaded as an artifact
#   push to main         also a release APK signed with the shared upload key
#   tag v*               also a GitHub Release with the signed APK attached
#
# The upload key comes from Dev_deploy_setup (Actions → Set up app repo there):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release APK is skipped and only the debug build is produced.
name: Android

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
    paths-ignore: ["watchos/**", "**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          # versionCode = commit count, so every main build installs over the last one.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.$(git rev-list --count HEAD).0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :protocol:test :app:testDebugUnitTest

      - name: Debug APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Release APK
        id: release
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; skipping the signed release build"
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          apk="iWatchBridge-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$apk"
          echo "apk=$RUNNER_TEMP/$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/app/build/screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.apk
        with:
          name: release-apk
          path: ${{ steps.release.outputs.apk }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.release.outputs.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.release.outputs.apk }}" --generate-notes --title "$GITHUB_REF_NAME"

      # Rolling "latest" release the app checks for self-update. Fixed asset URLs:
      #   .../releases/download/latest/latest.json   (versionCode, versionName, apk URL)
      #   .../releases/download/latest/iWatchBridge.apk
      - name: Publish rolling release for in-app update
        if: github.ref == 'refs/heads/main' && steps.release.outputs.apk
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          cp "${{ steps.release.outputs.apk }}" "$RUNNER_TEMP/iWatchBridge.apk"
          printf '{"versionCode": %s, "versionName": "%s", "apk": "https://github.com/%s/releases/download/latest/iWatchBridge.apk", "notes": "Automatic build from main."}\n' \
            "$CODE" "$NAME" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/latest.json"
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" --notes "Rolling build from main; the app updates itself from here." --latest=false
          gh release upload latest "$RUNNER_TEMP/iWatchBridge.apk" "$RUNNER_TEMP/latest.json" --clobber

