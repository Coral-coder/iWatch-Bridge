# XcodeGen project for Shared-with-iPhone mode: a watchOS app that links the watch to the
# Android phone over Bluetooth LE, embedded in a small iOS app (how watch apps ship through
# TestFlight / the App Store). Built by .github/workflows/ios-testflight.yml.
name: iWatchBridge
options:
  bundleIdPrefix: com.coralcoder
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  iWatchBridge:
    type: application
    platform: iOS
    sources: [PhoneApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coralcoder.iwatchbridge
        PRODUCT_NAME: iWatch Bridge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: iWatch Bridge
        # Take the build/version from the CI-provided build settings so the iOS app and the
        # embedded watch app always carry the same, incrementing numbers (Apple requires both).
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: iWatchBridgeWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  iWatchBridgeWatch:
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coralcoder.iwatchbridge.watchkitapp
        PRODUCT_NAME: iWatch Bridge
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Bridge
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.coralcoder.iwatchbridge
        NSBluetoothAlwaysUsageDescription: Bridge connects to your Android phone over Bluetooth to show its notifications and control its music.
        ITSAppUsesNonExemptEncryption: false
schemes:
  iWatchBridge:
    build:
      targets:
        iWatchBridge: all
        iWatchBridgeWatch: all
    archive:
      config: Release
